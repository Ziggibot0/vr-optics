<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>VR lens bench — optical test chart</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;color:#fff;
    font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
    overscroll-behavior:none;-webkit-user-select:none;user-select:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #gate{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;
    align-items:center;gap:18px;padding:24px;box-sizing:border-box;background:#000;z-index:10;text-align:center}
  #gate h1{font-size:19px;font-weight:600;margin:0;letter-spacing:.2px}
  #gate p{font-size:13px;line-height:1.5;color:#9a9a9a;margin:0;max-width:34em}
  #cal{display:flex;align-items:center;gap:10px;font-size:13px;color:#bbb}
  #cal b{color:#fff;font-variant-numeric:tabular-nums}
  .btn{background:#1c1c1e;color:#fff;border:1px solid #333;border-radius:9px;
    padding:9px 14px;font-size:15px;min-width:44px;font-family:inherit}
  .btn:active{background:#333}
  #start{background:#2f6fff;border-color:#2f6fff;font-weight:600;padding:13px 30px;font-size:16px}
  #refwrap{display:flex;flex-direction:column;align-items:center;gap:6px}
  #ref{height:0;border-top:0}
  #refbar{height:14px;border:1px solid #4a4a4a;border-radius:2px;
    background:repeating-linear-gradient(90deg,#fff 0 2px,#000 2px 4px)}
  #refbar span{display:none}
  #exit{position:fixed;top:8px;right:8px;z-index:20;display:none;
    background:rgba(255,255,255,.08);color:#888;border:1px solid #2a2a2a;
    border-radius:8px;width:34px;height:34px;font-size:15px;line-height:1}
  #hint{position:fixed;left:0;right:0;bottom:6px;text-align:center;font-size:10px;
    color:#4d4d4d;z-index:5;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="exit" aria-label="settings">&#9881;</button>
<div id="hint"></div>

<div id="gate">
  <h1>VR lens bench — optical test chart</h1>
  <p>Set screen brightness to max and turn off auto-brightness. Match the striped bar to
     a real ruler, then start: the chart fills the screen landscape, one half per eye.</p>
  <div id="refwrap">
    <div id="refbar"></div>
    <div id="cal">
      <button class="btn" id="minus">&minus;</button>
      <span><b id="mmval">50.0</b> mm on a ruler</span>
      <button class="btn" id="plus">+</button>
    </div>
  </div>
  <button class="btn" id="start">Start test</button>
  <p id="screeninfo" style="font-size:12px;color:#666"></p>
</div>

<script>
(function(){
  "use strict";
  var cv = document.getElementById('c'), ctx = cv.getContext('2d', {alpha:false});
  var gate = document.getElementById('gate'), ex = document.getElementById('exit');
  var hint = document.getElementById('hint'), refbar = document.getElementById('refbar');
  var MMLABEL = 50;                        // the reference bar is 50 real mm
  var pxPerMm = parseFloat(localStorage.getItem('vroptic_pxmm') || '0') || 0;
  if(!pxPerMm){                            // first guess from the physical screen
    var dp = Math.min(window.screen.width, window.screen.height);
    pxPerMm = (dp / (Math.min(screen.width,screen.height) > 700 ? 62 : 71.5));
  }
  var started = false, raf = 0;

  function savePx(){ localStorage.setItem('vroptic_pxmm', pxPerMm.toFixed(4)); }
  function drawRef(){
    refbar.style.width = (MMLABEL*pxPerMm) + 'px';
    document.getElementById('mmval').textContent = MMLABEL.toFixed(1);
    document.getElementById('screeninfo').textContent =
      'screen ' + (cv.clientWidth/pxPerMm).toFixed(1) + ' x ' +
      (cv.clientHeight/pxPerMm).toFixed(1) + ' mm  ·  ' + pxPerMm.toFixed(2) + ' px/mm';
  }
  document.getElementById('plus').onclick  = function(){ pxPerMm *= 1.02; savePx(); drawRef(); };
  document.getElementById('minus').onclick = function(){ pxPerMm /= 1.02; savePx(); drawRef(); };

  /* ---------- chart ---------- */
  function star(g, cx, cy, r, spokes){
    for(var i=0;i<spokes;i++){
      var a0 = i*2*Math.PI/spokes, a1 = a0 + Math.PI/spokes;
      g.beginPath(); g.moveTo(cx,cy);
      g.arc(cx, cy, r, a0, a1); g.closePath();
      g.fillStyle = (i%2) ? '#000' : '#fff'; g.fill();
    }
  }
  function grating(g, x, y, w, h, period, vertical){
    g.fillStyle = '#fff'; g.fillRect(x,y,w,h);
    g.fillStyle = '#000';
    if(vertical){ for(var i=0;i<w;i+=period) g.fillRect(x+i, y, period/2, h); }
    else         { for(var j=0;j<h;j+=period) g.fillRect(x, y+j, w, period/2); }
  }
  function half(g, x0, w, h, tag){
    // x0 = left edge of this eye's half, w = half width, h = full height
    var cx = x0 + w/2, cy = h/2, u = Math.min(w, h);      // u = layout unit
    g.fillStyle = '#101010'; g.fillRect(x0, 0, w, h);

    // frame: shows where the phone edge is (bezel test)
    g.strokeStyle = '#fff'; g.lineWidth = Math.max(2, u*0.004);
    g.strokeRect(x0 + w*0.02, h*0.02, w*0.96, h*0.96);

    // corner brackets
    var m = w*0.02 + u*0.04, L = u*0.06;
    g.lineWidth = Math.max(2, u*0.006);
    [[x0+m, h*0.02+u*0.04, 1, 1],[x0+w-m, h*0.02+u*0.04, -1, 1],
     [x0+m, h-h*0.02-u*0.04, 1, -1],[x0+w-m, h-h*0.02-u*0.04, -1, -1]]
      .forEach(function(p){ g.beginPath();
        g.moveTo(p[0]+p[2]*L, p[1]); g.lineTo(p[0], p[1]); g.lineTo(p[0], p[1]+p[3]*L); g.stroke(); });

    // centre crosshair
    g.lineWidth = Math.max(1, u*0.003); g.strokeStyle='#fff';
    g.beginPath(); g.moveTo(cx-u*0.10,cy); g.lineTo(cx+u*0.10,cy);
    g.moveTo(cx,cy-u*0.10); g.lineTo(cx,cy+u*0.10); g.stroke();

    // rings around the star
    var R0 = u*0.27;
    g.strokeStyle='#bbb';
    [1.0,0.82,0.64].forEach(function(k){
      g.lineWidth = Math.max(1, u*0.0025);
      g.beginPath(); g.arc(cx,cy,R0*k,0,7); g.stroke();
    });

    // Siemens star (the focus target)
    star(g, cx, cy, R0*0.50, 36);

    // centre 6-gon ring at the exact middle: reads as a dot when in focus
    g.fillStyle='#f00'; g.beginPath(); g.arc(cx,cy,Math.max(1.5,u*0.006),0,7); g.fill();

    // line gratings: 1,2,3,4 device px periods - finest = sharpness limit
    var gw = w*0.20, gh = h*0.11, gy = cy - gh/2;
    grating(g, x0+w*0.055, gy, gw, gh, 1, true);
    grating(g, x0+w*0.055, gy + gh*1.15, gw, gh*0.42, 2, true);
    grating(g, x0+w*0.055, gy + gh*1.75, gw, gh*0.42, 4, false);
    grating(g, x0+w*0.745, gy, gw, gh, 1, false);

    // checkerboard: contrast + astigmatism (egg vs circle)
    var cs = u*0.035, bx = x0+w*0.045, by = h - h*0.20;
    for(var i=0;i<6;i++) for(var j=0;j<5;j++){
      g.fillStyle = ((i+j)%2) ? '#fff' : '#000';
      g.fillRect(bx+i*cs, by+j*cs*0.72, cs, cs*0.72);
    }

    // text ladder: legibility falls off with size, so it grades focus
    g.fillStyle='#fff'; g.textAlign='center'; g.textBaseline='middle';
    var sizes = [0.052,0.040,0.030,0.021];
    var ly = Math.min(cy + R0 + u*0.05, h - u*0.135);
    sizes.forEach(function(s,i){
      g.font = '600 ' + (u*s).toFixed(1) + 'px ui-sans-serif,system-ui,sans-serif';
      g.fillText('FOCUS 0123456789', cx, ly + u*0.047*i);
    });

    // ID plate
    g.font = '600 ' + (u*0.030).toFixed(1) + 'px ui-sans-serif,system-ui,sans-serif';
    g.fillStyle='#2f6fff';
    g.fillText(tag, cx, h*0.02 + u*0.02);
  }
  function render(){
    var dpr = window.devicePixelRatio || 1;
    var W = Math.round(cv.clientWidth * dpr), H = Math.round(cv.clientHeight * dpr);
    if(cv.width !== W || cv.height !== H){ cv.width = W; cv.height = H; }
    ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
    half(ctx, 0, W/2, H, 'LEFT');
    half(ctx, W/2, W/2, H, 'RIGHT');
    // centre split line: black gap so the two eyes don't share a seam
    ctx.fillStyle='#000'; ctx.fillRect(W/2 - Math.max(2,W*0.0015), 0, Math.max(4,W*0.003), H);
    hint.textContent = (cv.clientWidth/pxPerMm).toFixed(0) + 'mm wide · ' +
                       pxPerMm.toFixed(2) + 'px/mm · tap gear to recalibrate';
  }
  function loop(){ render(); raf = requestAnimationFrame(loop); }

  function start(){
    gate.style.display = 'none'; ex.style.display = 'block'; started = true;
    if(cv.requestFullscreen) cv.requestFullscreen().catch(function(){});
    if(screen.orientation && screen.orientation.lock)
      try{ screen.orientation.lock('landscape').catch(function(){}); }catch(e){}
    cancelAnimationFrame(raf); loop();
  }
  function stop(){
    gate.style.display = 'flex'; ex.style.display = 'none'; started = false;
    cancelAnimationFrame(raf); drawRef();
    if(document.fullscreenElement) document.exitFullscreen().catch(function(){});
  }
  document.getElementById('start').onclick = start;
  ex.onclick = stop;
  window.addEventListener('resize', function(){ if(started) render(); });
  window.addEventListener('orientationchange', function(){ setTimeout(function(){ if(started) render(); },250); });
  window.addEventListener('keydown', function(e){ if(e.key==='Escape') stop(); });
  drawRef();
  if(location.search.indexOf('auto=1') >= 0) start();
})();
</script>
</body>
</html>

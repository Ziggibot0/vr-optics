<text x="110" y="100" font-family="Arial,Helvetica" font-size="2.6" text-anchor="middle" fill="#000">nose notch at bottom</text>
<text x="8" y="110" font-family="Arial,Helvetica" font-size="3.4" text-anchor="start" fill="#000" font-weight="bold">C. EYE-RELIEF STALKS</text>
<text x="8" y="114.5" font-family="Arial,Helvetica" font-size="3.0" text-anchor="start" fill="#000">cut 2 at the SAME number = your eye relief e</text>

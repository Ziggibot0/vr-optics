<text x="39" y="102" font-family="Arial,Helvetica" font-size="2.6" text-anchor="middle" fill="#000">recut to your lens</text>
<text x="80" y="34" font-family="Arial,Helvetica" font-size="3.4" text-anchor="start" fill="#000" font-weight="bold">B. EYE CARD  (cut hole, rest on brow)</text>

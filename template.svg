<text x="58" y="124" font-family="Arial,Helvetica" font-size="3.0" text-anchor="start" fill="#000">thick line = height 0, sits flush</text>
<text x="58" y="128" font-family="Arial,Helvetica" font-size="3.0" text-anchor="start" fill="#000">on the lens frame. Cut across at</text>
<text x="58" y="132" font-family="Arial,Helvetica" font-size="3.0" text-anchor="start" fill="#000">the number you want, tape the top</text>
<text x="58" y="136" font-family="Arial,Helvetica" font-size="3.0" text-anchor="start" fill="#000">end to the eye card.</text>
<text x="58" y="144" font-family="Arial,Helvetica" font-size="3.6" text-anchor="start" fill="#000" font-weight="bold">start at e = 20mm</text>
<text x="130" y="110" font-family="Arial,Helvetica" font-size="3.4" text-anchor="start" fill="#000" font-weight="bold">D. PHONE-DISTANCE GAUGE</text>
<text x="130" y="114.5" font-family="Arial,Helvetica" font-size="3.0" text-anchor="start" fill="#000">cut at the thick line, tape that end</text>
<text x="130" y="118" font-family="Arial,Helvetica" font-size="3.0" text-anchor="start" fill="#000">flush to the lens frame, let it hang.</text>
<text x="130" y="121.5" font-family="Arial,Helvetica" font-size="3.0" text-anchor="start" fill="#000">read the number level with the phone</text>
<text x="130" y="125" font-family="Arial,Helvetica" font-size="3.0" text-anchor="start" fill="#000">screen - that is your d.</text>

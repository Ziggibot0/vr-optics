<text x="110" y="27" font-family="Arial,Helvetica" font-size="3.0" text-anchor="start" fill="#000">if it doesn't, your printer scaled it</text>
<text x="8" y="34" font-family="Arial,Helvetica" font-size="3.4" text-anchor="start" fill="#000" font-weight="bold">A. LENS FRAME  (cut out, tape lens in the hole)</text>
